services:
  minio:
    # Stopgap, see ADR-0001: minio/minio is gone from Docker Hub and quay.io/minio/minio
    # is no longer publicly pullable. Tag + digest pinned for reproducibility.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
    # no `command:` — the Bitnami entrypoint starts the server, console on :9001 by default
    volumes:
      - minio-data:/bitnami/minio/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface — this is what dbt-clickhouse connects to
      - "9009:9000"   # native protocol, remapped on the host: 9000 is already taken by MinIO
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  minio-data:
  clickhouse-data:
